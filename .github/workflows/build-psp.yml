name: CCV LEGENDS - PSP Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CCV LEGENDS
        run: |
          docker run --rm \
            -v "$PWD:/build" \
            -w /build \
            pspdev/pspdev:latest \
            make

      - name: Upload PSP game
        uses: actions/upload-artifact@v4
        with:
          name: CCV-LEGENDS-PSP
          path: EBOOT.PBP
